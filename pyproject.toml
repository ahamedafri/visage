[project]
name = "visage"
version = "0.1.0"
description = "Free, self-hosted 2D lip-synced avatars for LiveKit voice agents — no per-minute avatar fees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["livekit", "avatar", "lip-sync", "voice-agent", "rhubarb", "viseme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Communications :: Conferencing",
]
dependencies = [
    "livekit-agents>=1.8.0",
    "pillow>=11.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visage = ["default_assets/*.png", "py.typed"]
