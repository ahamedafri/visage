[project]
name = "visage"
version = "0.1.0"
description = "Free, self-hosted 2D lip-synced avatars for LiveKit voice agents — no per-minute avatar fees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.8.0",
    "pillow>=11.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
